[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aims-workspace"
version = "0.1.0"
description = "AIMS — Asset Integrity Management System. Multi-agent platform for industrial engineering document automation."
authors = [
    {name = "AxiOMSphere", email = "noreply@axiompshere.com"}
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0",
    "redis>=5.0.0",
    "qdrant-client>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
docsreg-extract = [
    "markitdown",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ops*", "core*"]

[tool.pytest.ini_options]
testpaths = ["ops/tests"]
pythonpath = ["ops", "."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests as integration tests requiring external services",
    "slow: marks tests as slow running",
    "legacy_mock: marks tests that validate a local mock/fake, not real shipped code; exclude from certification counts via -m 'not legacy_mock'",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # Line too long — black handles this
