schema_version: "1.0"
description: >
  AIMS Agent Self-Learning Skill Registry — skeleton.
  Tracks hermes sandbox skills through the AIMS lifecycle.
  All entries start at OBSERVED_PATTERN; manual promotion gates required.

safety_invariants:
  self_approval_allowed: false
  runtime_activation_allowed: false
  direct_deletion_allowed: false
  secrets_in_registry_allowed: false
  model_slot_conflict_allowed: false

# 9 registered AIMS agents
agents:
  - axi
  - omi
  - argus
  - logi
  - traini
  - knomi
  - doci
  - mainy_repairman
  - hermes_external_worker

# Promotion gate definitions (informational — enforced by promotion_gates.py)
gate_definitions:
  argus_gate:
    always_required: true
    description: "Argus infra stability — no active P0/P1 incidents."
  logi_gate:
    always_required: true
    description: "Logi coordination — no cross-dept workflow conflicts."
  qa_gate:
    always_required: true
    description: "QA gate — test coverage and dry-run evidence required."
  traini_gate:
    always_required: false
    conditional_flag: model_related
    description: "Traini model-safety gate — required for model_related skills."
  poli_gate:
    always_required: false
    required_for_states:
      - ACTIVE_RUNTIME_SKILL
    conditional_flag: production_related
    description: "Poli access-control gate — required before production activation."

# Seed entries — one per focus skill, all starting at OBSERVED_PATTERN
entries:

  - skill_id: hermes-agent-skill-authoring
    owner_agent_id: axi
    lifecycle_state: OBSERVED_PATTERN
    source_hermes_category: software-development
    source_hermes_name: hermes-agent-skill-authoring
    description: "Skill authoring patterns for Hermes agent skills in AIMS context."
    observed_count: 2
    confidence: 0.7
    risk_flags:
      secrets_related: false
      deletion_or_quarantine_related: false
      service_restart_related: false
      production_related: false
      model_related: false
    required_gates: [argus_gate, logi_gate, qa_gate]
